name: Send scheduled email

# Daily at 13:23 UTC. That is 9:23am Eastern while daylight saving is in effect
# and 8:23am once it ends, because GitHub cron is always UTC and does not follow
# local clock changes. Moved off the hour deliberately: every scheduled run of
# this workflow at :00 has been hours late, and :00 is when GitHub's scheduler
# is most congested.
#
# The cron is a backstop, not the primary trigger, and moving it off the hour
# did not help. Every firing so far has been hours late: 24 September at 17:36,
# 28 September at 19:52, 30 September at 18:28, which is 5h05m after the 13:23
# it is set for. Treat the arrival time as unpredictable within the day.
#
# The sweep run dispatches this workflow itself once its queue is verified, so
# by the time a late cron arrives the day has usually already been delivered
# and send.py exits 2. That is the expected outcome and the step below passes
# it deliberately. It did not until 30 September: the exit-code policy sat
# under an inherited errexit and had never executed, so all three late crons
# went red for the one reason that is not a problem. tools/mail/test_workflow_gate.py
# runs that policy under bash -e now, so it cannot go quiet again.
on:
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:
    inputs:
      check_auth:
        description: "Only test the Gmail credentials. Sends nothing, needs nothing queued."
        type: boolean
        default: false
      dry_run:
        description: "Check everything but do not send, move or commit"
        type: boolean
        default: false
      date:
        description: "Override the date to send, as YYYY-MM-DD. Leave blank for today."
        type: string
        default: ""
      to:
        description: "Send to this address only, instead of everyone in send_config.yaml. For testing."
        type: string
        default: ""

# Needed so the job can commit the outbox to sent move and push it back.
permissions:
  contents: write

concurrency:
  group: send-scheduled-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Keep the token on disk so the push at the end of send.py works.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # "schedule" for a cron firing, "workflow_dispatch" for a person or
          # the sweep run pressing the button.
          TRIGGER: ${{ github.event_name }}
        run: |
          # set +e is load bearing and must come first. GitHub runs this step
          # as "bash -e {0}", so errexit is already ON before the first line,
          # and "set -uo pipefail" does NOT clear it: set only turns options
          # on or off as named. Without the +e, the first non-zero exit from
          # send.py kills the script instantly and every line below here,
          # including the whole exit-code policy, is unreachable. That is
          # exactly what happened: the 18:28 UTC cron on 30 September exited
          # 2 and went red without ever printing the notice, and so did the
          # runs on 24 and 28 September. The policy was written, merged, and
          # never once executed.
          set +e -uo pipefail
          ARGS=""
          if [ "${{ inputs.check_auth }}" = "true" ]; then
            python3 tools/mail/send.py --check-auth
            exit $?
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.date }}"
          fi
          if [ -n "${{ inputs.to }}" ]; then
            ARGS="$ARGS --to ${{ inputs.to }}"
          fi
          python3 tools/mail/send.py $ARGS
          STATUS=$?

          # Exit codes, from tools/mail/send.py:
          #   0 sent, or dry run / auth check completed
          #   1 configuration or credential problem
          #   2 nothing queued for that date
          #   3 already sent
          #   4 delivery or git failure
          #
          # 2 and 3 both mean "there is nothing to do", which is the normal
          # outcome for a late cron on a day the sweep run has already
          # delivered. Failing the job on those turns a working pipeline red
          # twice a week and trains everyone to ignore the red, which is how a
          # genuine delivery failure gets missed. A person or the sweep run
          # pressing the button IS expecting a send, so there they stay
          # failures.
          if [ "$STATUS" -eq 2 ] || [ "$STATUS" -eq 3 ]; then
            if [ "$TRIGGER" = "schedule" ]; then
              echo "::notice::Nothing to send for this date (exit $STATUS). The scheduled run is a backstop and the day was already handled, so this is not a failure."
              exit 0
            fi
            echo "::error::Nothing was sent (exit $STATUS), and this run was triggered deliberately rather than by cron."
          fi
          exit $STATUS
