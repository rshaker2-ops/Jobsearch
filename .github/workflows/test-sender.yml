name: Tests

# Runs on every pull request, with no paths filter. There used to be one,
# scoped to tools/mail, which meant a change to the sweep pipeline or the
# document builder merged with no checks at all. The seventeen em dashes that
# were rendering into the .docx being emailed to people lived in
# tools/build/_example_doc.js, which the filter did not cover. The job takes
# under ten seconds, so filtering bought nothing and hid things.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sender tests
        run: python3 tools/mail/test_send.py

      - name: Send workflow exit-code policy
        # Lifts the Send step's script out of send-scheduled-email.yml and runs
        # it under bash -e, the way the runner does. Added after the 30
        # September cron went red on exit 2: the policy that was supposed to
        # pass that case was unreachable under errexit and had never once run.
        # PyYAML is needed to read the workflow and is not in the 3.12 image.
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -m unittest tools.mail.test_workflow_gate -v

      - name: Location evidence classifier tests
        # location_evidence() in run.py says what a posting itself claims about
        # where the work happens: remote, place, conflict or silent. Added
        # 3 October on Bob's instruction to keep trusting the LinkedIn remote
        # flag but call out postings that never address location. Every string
        # in these tests came out of a real posting, because the label decides
        # whether a remote-only candidate is told a role is reachable.
        run: python3 -m unittest discover -s tools/sweep -p "test_location.py" -t tools/sweep -v

      - name: Duplicate posting collapse tests
        # tools/sweep/dedupe.py collapses one job advertised twice: a renamed
        # company, a parent and its subsidiary, or an agency beside its client.
        # Added 3 October after Bob's qualifying set was reported as 31 when 3
        # of the 31 were duplicates and the honest figure was 28. The near-miss
        # cases matter as much: merging sixteen unrelated Chief Technology
        # Officer postings would be worse than the miscount.
        run: python3 -m unittest discover -s tools/sweep -p "test_dedupe.py" -t tools/sweep -v

      - name: Figure tracing check tests
        # tools/check_figures.py traces every dollar figure in a built document
        # back to posting text, a parsed band, a floor, or arithmetic on those.
        # Added 2 October after Jeff's document quoted an invented $95,000 to
        # $115,000 base range off an OTE label. These tests also pin what the
        # check deliberately does NOT catch, so nobody trusts it further than it
        # goes: see the StatedLimits cases.
        run: python3 -m unittest discover -s tools -p "test_check_figures.py" -t tools -v

      - name: Sweep pipeline tests
        run: python3 tools/sweep/test_run.py

      - name: Every profile resolves and the sweep is runnable
        run: |
          python3 - <<'EOF'
          import re, sys
          sys.path.insert(0, "tools/sweep")
          import run
          for key, profile in run.PROFILES.items():
              queries = len(profile["linkedin_queries"]) + len(profile["workday_queries"])
              # Every pattern must compile, and fit_signal must expose exactly one
              # group: run.py calls FIT.findall(), and a nested capturing group
              # makes that return tuples instead of strings. Jonny's profile did
              # that on 28 September and killed the sweep after eight queries.
              for field in ("title_keep", "title_scope", "title_drop", "hard_gate", "fit_signal"):
                  re.compile(profile[field])
              groups = re.compile(profile["fit_signal"]).groups
              assert groups == 1, (
                  f"{key}: fit_signal has {groups} capturing groups, needs exactly 1. "
                  f"Make inner alternations non-capturing with (?:...)."
              )
              sample = re.compile(profile["fit_signal"]).findall("roadmap and product strategy")
              assert all(isinstance(x, str) for x in sample), f"{key}: findall returns tuples"
              print(f"ok: {key:7s} {profile['email']:26s} {queries} queries, floor ${profile['floor']:,}")
          EOF

      - name: Document builders parse
        run: |
          set -e
          for f in tools/build/*.js; do
            node --check "$f"
            echo "ok: $f"
          done

      - name: Mail config parses and every address is an address
        run: |
          python3 - <<'EOF'
          import re, sys
          sys.path.insert(0, "tools/mail")
          from pathlib import Path
          from send import read_config
          cfg = read_config(Path("send_config.yaml"))
          assert cfg.get("sender"), "send_config.yaml has no sender"
          assert cfg.get("recipients"), "send_config.yaml has no recipients"
          pattern = re.compile(r"^[^@\s]+@[^@\s]+\.[^@\s]+$")
          for address in [cfg["sender"], *cfg["recipients"]]:
              assert pattern.match(address), f"not an email address: {address!r}"
          assert "{date" in cfg.get("subject", ""), "subject has no {date} placeholder"
          print(f"ok: {len(cfg['recipients'])} recipients, from {cfg['sender']}")
          EOF

      - name: Every profile has a recipient and every recipient has a profile
        run: |
          python3 - <<'EOF'
          import sys
          sys.path.insert(0, "tools/sweep"); sys.path.insert(0, "tools/mail")
          from pathlib import Path
          import run
          from send import read_config
          cfg = read_config(Path("send_config.yaml"))
          profiles = {p["email"] for p in run.PROFILES.values()}
          recipients = set(cfg["recipients"])
          missing = profiles - recipients
          assert not missing, f"swept but never emailed: {sorted(missing)}"
          extra = recipients - profiles
          if extra:
              print(f"note: emailed without a profile of their own: {sorted(extra)}")
          print(f"ok: {len(profiles)} profiles, {len(recipients)} recipients")
          EOF

      - name: Queued per-recipient mail is addressed to real profiles
        run: |
          python3 - <<'EOF'
          import sys
          sys.path.insert(0, "tools/sweep")
          from pathlib import Path
          import run
          known = {p["email"] for p in run.PROFILES.values()}
          checked = 0
          for box in ("outbox", "sent"):
              for day in sorted(Path(box).glob("*")):
                  if not day.is_dir() or day.name.endswith(".files"):
                      continue
                  bodies = sorted(day.glob("*.html"))
                  assert bodies, f"{day} holds no <address>.html"
                  for body in bodies:
                      assert body.stem in known, (
                          f"{body} is addressed to {body.stem!r}, which is not "
                          f"any profile's email. Known: {sorted(known)}"
                      )
                      checked += 1
                  addressed = {body.stem for body in bodies}
                  for item in day.iterdir():
                      ok = item.suffix == ".html" or item.name.endswith(".files")
                      assert ok, f"{item} is neither <address>.html nor <address>.files/"
                      if item.name.endswith(".files"):
                          owner = item.name[: -len(".files")]
                          assert owner in addressed, (
                              f"{item} has no {owner}.html beside it, so those "
                              f"attachments would never be sent and {owner} "
                              f"would silently get no mail"
                          )
          print(f"ok: {checked} per-recipient bodies, all addressed to known profiles")
          EOF

      - name: Each ActiveState narrative names one profile and only its owner
        run: |
          python3 - <<'EOF'
          import sys
          sys.path.insert(0, "tools/sweep")
          from pathlib import Path
          import run
          # These files are rendered into a candidate's document and were
          # emailed to them individually. A name from another candidate landing
          # in one is the same leak the per-recipient sender exists to prevent,
          # and it would reach an interview rather than an inbox.
          folder = Path("tools/sweep/narratives")
          files = sorted(folder.glob("*.md")) if folder.is_dir() else []
          for path in files:
              owner = path.stem
              assert owner in run.PROFILES, (
                  f"{path} names no profile, so nothing would ever render it. "
                  f"Known: {sorted(run.PROFILES)}"
              )
              body = path.read_text()
              for key, profile in run.PROFILES.items():
                  if key == owner:
                      continue
                  for token in (key, profile["email"], profile["folder"]):
                      assert token not in body, (
                          f"{path} belongs to {owner} but mentions {token!r}, "
                          f"which is {key}'s. One person's narrative must never "
                          f"reach another person's document."
                      )
          print(f"ok: {len(files)} narratives, each naming only its own owner")
          EOF

      - name: No em dashes anywhere in the repository
        run: python3 tools/check_no_em_dashes.py
